plugins {
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {

}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        url = 'https://masa.dy.fi/maven'
    }
    maven {
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups('fi.dy.masa') }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        url = 'https://www.cursemaven.com'
    }
    maven {
        url = 'https://maven.fallenbreath.me/jitpack'
    }
    maven {
        url = 'https://maven.fallenbreath.me/releases'
    }
    maven {
        url = "https://api.modrinth.com/maven" }
}

dependencies {

    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"


    modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modImplementation "com.github.sakura-ryoko:malilib:${project.malilib_version}"

    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

   // modCompileOnly "maven.modrinth:iris:${project.iris_version}"

   // modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

    //modCompileOnly "com.github.sakura-ryoko:litematica:${project.litematica_version}"

    //modImplementation "com.github.sakura-ryoko:tweakeroo:${project.tweakeroo_version}"

}

processResources {

    from project(":common").sourceSets.main.resources

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {

    from project(":common").sourceSets.main.resources

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {

    }
}
