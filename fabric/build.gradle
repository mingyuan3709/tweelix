plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id "maven-publish"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// ---------- 仓库 ----------
repositories {
    maven { url = 'https://masa.dy.fi/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.fallenbreath.me/jitpack' }
    maven { url = 'https://maven.fallenbreath.me/releases' }
    maven { url = "https://api.modrinth.com/maven" }
}

// ---------- 依赖 ----------
dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    implementation "maven.modrinth:malilib:${project.malilib_version}"
    implementation "maven.modrinth:modmenu:${project.mod_menu_version}"
    include(implementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))

    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:litematica:${project.litematica_version}"
}

// ---------- 资源处理 ----------
processResources {
    dependsOn project(":common").tasks.processResources
    from project(":common").sourceSets.main.resources

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// ---------- Java 编译配置 ----------
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

// ---------- ShadowJar（最终产物） ----------
shadowJar {
    exclude "META-INF/neoforge.mods.toml"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null  // 最终产物不需要 classifier
    archiveFileName = "${project.archives_base_name}-${project.version}-mc${project.minecraft_version}-fabric.jar"

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    archiveClassifier = "bare"
}

// ---------- 发布 ----------
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        // 配置发布仓库
    }
}