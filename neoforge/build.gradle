plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id "maven-publish"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}


base {
    archivesName = project.archives_base_name
}

tasks.named('remapJar') {
    archiveFileName = "${project.archives_base_name}-${project.version}-mc${project.minecraft_version}-neoforge.jar"
}

tasks.named('shadowJar') {
    archiveFileName = "${project.archives_base_name}-${project.version}-mc${project.minecraft_version}-neoforge-shadow.jar"
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)
    developmentNeoForge.extendsFrom(common)
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven" }

    maven {url = 'https://maven.fallenbreath.me/releases'
        content {includeGroupAndSubgroups("me.fallenbreath")}
    }

    maven {
        url = "https://dl.cloudsmith.io/public/thinkingstudio/forgifiedfabricapi/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    modImplementation "maven.modrinth:mafglib:${project.mafglib_version}"

    include(implementation("me.fallenbreath:conditional-mixin-${loom.platform.get().id()}:${project.conditionalmixin_version}"))

}

processResources {

    // 1. 声明依赖于 common 模块的 processResources 结果
    dependsOn project(":common").tasks.processResources

    // 2. 引入公共模块的资源文件
    from project(":common").sourceSets.main.resources

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
    inputs.property "META-INF/neoforge.mods.toml", project.version
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "tweelix.accessWidener"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "shadow"
}

jar {
    archiveClassifier = "bare"
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
    archiveClassifier = null
}