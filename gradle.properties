org.gradle.jvmargs=-Xmx1G

loom_fabric_repository=https://maven2.fabricmc.net/

# Minecraft
minecraft_version=26.3

# Mod Properties
mod_version=0.4.1
maven_group=ink.mingyuan
archives_base_name=tweelix

# Fabric
loader_version=0.19.5

# Fabric Mod
fabric_version=0.161.0+26.3

mod_menu_version=21.0.0

iris_version=1.11.7+26.3-fabric

sodium_version=mc26.3-0.9.3-beta.1-fabric

malilib_version = 0.30.2

litematica_version = 0.29.1

conditionalmixin_version=0.6.5

# 本项目需要 JDK 25：Minecraft 26.3 的依赖为 class file 69，且 Loom 要求 Gradle 运行在 25 上。
# 机器相关的 JDK 路径请放在用户级配置（不要提交到仓库）：
#   %USERPROFILE%\.gradle\gradle.properties
#     org.gradle.java.home=D:/path/to/jdk-25
#     org.gradle.java.installations.paths=D:/path/to/jdk-25
